<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BELOURA NY • Facturación</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#0b1220;color:#e2e8f0}
    .wrap{max-width:900px;margin:0 auto;padding:22px 16px}
    .card{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:18px}
    h1{margin:0 0 10px;font-size:20px}
    .grid{display:grid;gap:12px}
    @media(min-width:820px){.grid-2{grid-template-columns:1fr 1fr}}
    label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:6px}
    input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:#e2e8f0}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{padding:12px 14px;border-radius:12px;border:1px solid #334155;background:#111c33;color:#e2e8f0;cursor:pointer}
    button.primary{border-color:#60a5fa}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{margin-top:12px;font-size:13px;color:#cbd5e1;white-space:pre-line}
    .pill{display:inline-block;padding:6px 10px;border:1px solid #334155;border-radius:999px;background:#0b1220;color:#cbd5e1;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>BELOURA NY • Facturación</h1>

    <div class="grid grid-2">
      <div>
        <label>Cliente</label>
        <select id="cliente"></select>
      </div>

      <div>
        <label>Tarifa</label>
        <select id="tarifa"></select>
      </div>

      <div>
        <label>Peso (LB)</label>
        <input id="peso" type="number" step="0.01" min="0" placeholder="Ej: 8.50" />
      </div>

      <div>
        <label>Total</label>
        <input id="total" type="text" readonly placeholder="$0.00" />
      </div>

      <div>
        <label>Estado</label>
        <select id="estado">
          <option value="Pendiente">Pendiente</option>
          <option value="Pagado">Pagado</option>
        </select>
      </div>

      <div>
        <label>Tracking / Guía (opcional)</label>
        <input id="tracking" type="text" placeholder="Ej: BLR-2026-000123 / USPS..." />
      </div>
    </div>

    <div class="row">
      <button id="btnLoad">Recargar listas</button>
      <button id="btnSave" class="primary">Guardar y generar PDF</button>
      <button id="btnWhats" disabled>Enviar por WhatsApp</button>
      <button id="btnVerify" disabled>Verificar</button>
      <span class="pill" id="lastCode" style="display:none;"></span>
    </div>

    <div class="status" id="status">Listo.</div>
  </div>
</div>

<script>
  // WebApp URL (tu /exec)
  const API_URL = "https://script.google.com/macros/s/AKfycbxCpxVaFuGySLuEdI1vRARGK8vr4Y9V4ko25DNSCd5iMjSkdoUN8tkmDiQEzwaMYlmc/exec";

  // Debe coincidir con backend
  const SECRET_KEY = "Beloura2025@";

  // Si hosteas verify externo (recomendado), pon aquí tu URL:
  // Ej: "https://beloura.shop/verify.html"
  // Si lo dejas vacío, usará verify interno del WebApp (si el backend lo soporta).
  const VERIFY_PAGE_URL = ""; 

  const $ = (id) => document.getElementById(id);
  let clientes = [];
  let tarifas = [];

  let lastFactura = null; // guarda {codigoFactura, pdfUrl, verifyUrl, whatsappText}

  function setStatus(msg){ $("status").textContent = msg; }

  function money(n){
    const x = Number(n);
    if (!isFinite(x)) return "$0.00";
    return x.toLocaleString("en-US",{style:"currency",currency:"USD"});
  }

  async function api(payload){
  const form = new URLSearchParams();
  form.set("payload", JSON.stringify(payload));

  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8" },
    body: form.toString()
  });

  return res.json();
}


  function recalc(){
    const peso = Number($("peso").value);
    const t = tarifas[Number($("tarifa").value)];
    const total = (peso > 0 && t) ? (peso * Number(t.Valor)) : 0;
    $("total").value = money(Math.round((total + Number.EPSILON) * 100) / 100);
  }

  async function loadAll(){
    setStatus("Cargando clientes y tarifas...");
    $("btnSave").disabled = true;
    $("btnWhats").disabled = true;
    $("btnVerify").disabled = true;
    $("lastCode").style.display = "none";
    lastFactura = null;

    const c = await api({ action:"listClientes", secretKey: SECRET_KEY });
    if (!c.ok) { setStatus("Error clientes: " + (c.error || "unknown")); $("btnSave").disabled=false; return; }
    clientes = c.clientes || [];

    $("cliente").innerHTML = clientes.map((x,i)=>(
      `<option value="${i}">${x.CodigoCliente} - ${x.NombreCompleto}</option>`
    )).join("");

    const t = await api({ action:"listTarifas", secretKey: SECRET_KEY });
    if (!t.ok) { setStatus("Error tarifas: " + (t.error || "unknown")); $("btnSave").disabled=false; return; }
    tarifas = t.tarifas || [];

    $("tarifa").innerHTML = tarifas.map((x,i)=>(
      `<option value="${i}">${x.Tarifa} (${money(x.Valor)}/lb)</option>`
    )).join("");

    $("btnSave").disabled = false;
    recalc();
    setStatus(`Listo. Clientes: ${clientes.length} • Tarifas: ${tarifas.length}`);
  }

  function buildVerifyUrl(code){
    if (VERIFY_PAGE_URL && VERIFY_PAGE_URL.startsWith("http")) {
      const sep = VERIFY_PAGE_URL.includes("?") ? "&" : "?";
      return `${VERIFY_PAGE_URL}${sep}code=${encodeURIComponent(code)}`;
    }
    // fallback: verify interno del WebApp
    return `${API_URL}?page=verify&code=${encodeURIComponent(code)}`;
  }

  async function saveFactura(){
    const c = clientes[Number($("cliente").value)];
    const t = tarifas[Number($("tarifa").value)];
    const peso = Number($("peso").value);
    const estado = $("estado").value;
    const tracking = $("tracking").value.trim();

    if (!c) return setStatus("Selecciona un cliente válido.");
    if (!t) return setStatus("Selecciona una tarifa válida.");
    if (!(peso > 0)) return setStatus("Ingresa un peso válido.");

    $("btnSave").disabled = true;
    $("btnWhats").disabled = true;
    $("btnVerify").disabled = true;
    $("lastCode").style.display = "none";
    lastFactura = null;

    setStatus("Guardando factura y generando PDF...");

    const r = await api({
      action: "createFactura",
      secretKey: SECRET_KEY,
      CodigoCliente: c.CodigoCliente,
      Peso: peso,
      Tarifa: t.Tarifa,
      Estado: estado,
      Tracking: tracking
    });

    $("btnSave").disabled = false;

    if (!r.ok) {
      setStatus("Error: " + (r.error || "unknown"));
      return;
    }

    $("peso").value = "";
    $("tracking").value = "";
    recalc();

    const code = r.factura?.codigoFactura || "";
    const pdfUrl = r.pdfUrl || r.factura?.pdfUrl || "";
    const verifyUrl = r.verifyUrl || r.factura?.verifyUrl || buildVerifyUrl(code);
    const waText = r.whatsappText || "";

    lastFactura = { code, pdfUrl, verifyUrl, waText };

    $("lastCode").textContent = `Última: ${code}`;
    $("lastCode").style.display = code ? "inline-block" : "none";

    $("btnWhats").disabled = !waText;
    $("btnVerify").disabled = !verifyUrl;

    setStatus(
      `Factura guardada.\n` +
      `Código: ${code}\n` +
      `Total: ${money(r.factura.total)}\n` +
      (pdfUrl ? `PDF: listo\n` : ``) +
      (verifyUrl ? `Verificación: lista` : ``)
    );

    if (pdfUrl) window.open(pdfUrl, "_blank");
  }

  function sendWhatsApp(){
    if (!lastFactura?.waText) return;
    // Si tienes número fijo, puedes armar wa.me/<numero>; aquí lo dejamos a "share" genérico
    const url = `https://wa.me/?text=${encodeURIComponent(lastFactura.waText)}`;
    window.open(url, "_blank");
  }

  function openVerify(){
    if (!lastFactura?.verifyUrl) return;
    window.open(lastFactura.verifyUrl, "_blank");
  }

  $("btnLoad").addEventListener("click", loadAll);
  $("btnSave").addEventListener("click", saveFactura);
  $("btnWhats").addEventListener("click", sendWhatsApp);
  $("btnVerify").addEventListener("click", openVerify);
  $("peso").addEventListener("input", recalc);
  $("tarifa").addEventListener("change", recalc);

  loadAll();
</script>
</body>
</html>
